[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holochain-music-storage-prototype"
version = "0.1.0"
description = "File-type-independent encrypted full-replica storage protocol prototype for Holochain Music"
requires-python = ">=3.10"
dependencies = ["cryptography>=44,<48"]

[tool.setuptools.packages.find]
include = ["holochain_storage*"]
