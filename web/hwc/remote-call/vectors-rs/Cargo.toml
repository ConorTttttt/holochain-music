[package]
name = "zome-call-vectors"
version = "0.1.0"
edition = "2021"
publish = false
# Emits canonical Holochain 0.7 ZomeCallParams bytes and signatures for the
# browser call_remote authorisation tests. TEST-ONLY fixed keys.

[workspace]

[dependencies]
holochain_zome_types = "=0.7.0"
holo_hash = { version = "=0.7.0", features = ["hashing"] }
holochain_serialized_bytes = "*"
holochain_nonce = "=0.7.1"
ed25519-dalek = "2"
serde_json = "1"
hex = "0.4"
