<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Holochain Music</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Navigation">
      <div class="brand"><img src="/icon.svg" alt="" width="32" height="32"><div><strong>Holochain Music</strong><small id="net-status" aria-live="polite">Starting…</small></div></div>
      <nav aria-label="Listen">
        <p class="nav-head">Listen</p>
        <button class="nav" data-view="browse" data-icon="compass" type="button"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#compass-regular"></use></svg><span>Browse</span></button>
        <button class="nav" data-view="artists" data-icon="users" type="button"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#users-regular"></use></svg><span>Artists</span></button>
        <button class="nav" data-view="library" data-icon="music-notes" type="button"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#music-notes-regular"></use></svg><span>Your library</span></button>
        <button class="nav" data-view="playlists" data-icon="playlist" type="button"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#playlist-regular"></use></svg><span>Playlists</span></button>
        <button class="nav" data-view="history" data-icon="clock-counter-clockwise" type="button"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#clock-counter-clockwise-regular"></use></svg><span>Recently played</span></button>
        <button class="nav" data-view="queue" data-icon="list-dashes" type="button"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#list-dashes-regular"></use></svg><span>Queue</span><span id="queue-count" class="pill" hidden></span></button>
      </nav>
      <nav aria-label="Artist studio">
        <p class="nav-head">Artist studio</p>
        <button class="nav" data-view="publish" data-icon="microphone-stage" type="button"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#microphone-stage-regular"></use></svg><span>Publish a track</span></button>
        <button class="nav" data-view="requests" data-icon="handshake" type="button"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#handshake-regular"></use></svg><span>Access requests</span> <span id="request-count" class="pill" hidden></span></button>
        <button class="nav" data-view="mytracks" data-icon="vinyl-record" type="button"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#vinyl-record-regular"></use></svg><span>Your releases</span></button>
      </nav>
      <nav aria-label="Settings">
        <button class="nav" data-view="settings" data-icon="gear" type="button"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#gear-regular"></use></svg><span>Identity &amp; settings</span></button>
      </nav>
    </aside>
    <main id="main" class="main" tabindex="-1">
      <header class="topbar">
        <div class="appearance-control">
          <label for="appearance">Appearance</label>
          <select id="appearance" name="appearance">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <form id="search-form" role="search" class="search">
          <label for="search" class="sr-only">Search tracks</label>
          <input id="search" type="search" placeholder="Search tracks (press /)" minlength="2" maxlength="80" autocomplete="off">
        </form>
      </header>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <footer class="player" aria-label="Player">
    <div class="now"><div class="art" aria-hidden="true">♪</div><div class="now-text"><strong id="now-title">Nothing playing</strong><span id="now-artist">Choose a track</span></div></div>
    <div class="transport">
      <div class="buttons">
        <button id="btn-stop" type="button" aria-label="Stop" title="Stop"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#stop-regular"></use></svg></button>
        <button id="btn-back" type="button" aria-label="Back 10 seconds" title="Back 10 s (←)"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#rewind-regular"></use></svg></button>
        <button id="btn-play" class="primary" type="button" aria-label="Play" title="Play / pause (Space)"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#play-fill"></use></svg></button>
        <button id="btn-fwd" type="button" aria-label="Forward 10 seconds" title="Forward 10 s (→)"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#fast-forward-regular"></use></svg></button>
        <button id="btn-next" type="button" aria-label="Next in queue" title="Next (N)"><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#skip-forward-regular"></use></svg></button>
      </div>
      <div class="timeline">
        <span id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position">
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="side">
      <span id="state-badge" class="badge" role="status">Idle</span>
      <label class="volume"><span class="sr-only">Volume</span><svg class="ph-icon" aria-hidden="true" focusable="false"><use href="/icons.svg#speaker-high-regular"></use></svg><input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume"></label>
    </div>
  </footer>
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
