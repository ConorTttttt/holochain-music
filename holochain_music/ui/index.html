<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Holochain Music</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Navigation">
      <div class="brand"><img src="/icon.svg" alt="" width="32" height="32"><div><strong>Holochain Music</strong><small id="net-status" aria-live="polite">Starting…</small></div></div>
      <nav aria-label="Listen">
        <p class="nav-head">Listen</p>
        <button class="nav" data-view="browse" type="button">Browse</button>
        <button class="nav" data-view="artists" type="button">Artists</button>
        <button class="nav" data-view="library" type="button">Your library</button>
        <button class="nav" data-view="playlists" type="button">Playlists</button>
        <button class="nav" data-view="history" type="button">Recently played</button>
        <button class="nav" data-view="queue" type="button">Queue <span id="queue-count" class="pill" hidden></span></button>
      </nav>
      <nav aria-label="Artist studio">
        <p class="nav-head">Artist studio</p>
        <button class="nav" data-view="publish" type="button">Publish a track</button>
        <button class="nav" data-view="requests" type="button">Access requests <span id="request-count" class="pill" hidden></span></button>
        <button class="nav" data-view="mytracks" type="button">Your releases</button>
      </nav>
      <nav aria-label="Settings">
        <button class="nav" data-view="settings" type="button">Identity &amp; settings</button>
      </nav>
    </aside>
    <main id="main" class="main" tabindex="-1">
      <header class="topbar">
        <div class="appearance-control">
          <label for="appearance">Appearance</label>
          <select id="appearance" name="appearance">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>
        <form id="search-form" role="search" class="search">
          <label for="search" class="sr-only">Search tracks</label>
          <input id="search" type="search" placeholder="Search tracks (press /)" minlength="2" maxlength="80" autocomplete="off">
        </form>
      </header>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <footer class="player" aria-label="Player">
    <div class="now"><div class="art" aria-hidden="true">♪</div><div class="now-text"><strong id="now-title">Nothing playing</strong><span id="now-artist">Choose a track</span></div></div>
    <div class="transport">
      <div class="buttons">
        <button id="btn-stop" type="button" aria-label="Stop" title="Stop">■</button>
        <button id="btn-back" type="button" aria-label="Back 10 seconds" title="Back 10 s (←)">«</button>
        <button id="btn-play" class="primary" type="button" aria-label="Play" title="Play / pause (Space)">▶</button>
        <button id="btn-fwd" type="button" aria-label="Forward 10 seconds" title="Forward 10 s (→)">»</button>
        <button id="btn-next" type="button" aria-label="Next in queue" title="Next (N)">⏭</button>
      </div>
      <div class="timeline">
        <span id="elapsed">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position">
        <span id="duration">0:00</span>
      </div>
    </div>
    <div class="side">
      <span id="state-badge" class="badge" role="status">Idle</span>
      <label class="volume"><span class="sr-only">Volume</span>🔈<input id="volume" type="range" min="0" max="100" value="100" aria-label="Volume"></label>
    </div>
  </footer>
  <div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
