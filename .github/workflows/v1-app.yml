name: v1 application

on:
  pull_request:
  push:
    branches: [feat/v1-app-integration]

permissions:
  contents: read

jobs:
  app-and-quic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Storage + catalogue integrity zome tests (locked 0.7.0 types)
        run: |
          (cd dna && cargo test --locked --lib)
          (cd music-dna && cargo test --locked -p music_catalogue_integrity --lib)
          (cd dna && cargo check --locked --target wasm32-unknown-unknown)
      - name: Build MoQ host and S4 node
        run: |
          cargo test --locked --manifest-path crates/moq-music/Cargo.toml
          cargo build --locked --release --manifest-path crates/moq-music/Cargo.toml
          cargo build --manifest-path crates/storage-node/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: All Python tests incl. real QUIC (two-conductor e2e is opt-in, needs Holochain)
        env:
          HOLOCHAIN_MOQ_BIN: ${{ github.workspace }}/crates/moq-music/target/release/holochain-music-moq
          HOLOCHAIN_STORAGE_NODE_BIN: ${{ github.workspace }}/crates/storage-node/target/debug/holochain-storage-node
        run: python -m unittest discover -s tests -v
      - name: UI script syntax
        run: node --check holochain_music/ui/app.js
