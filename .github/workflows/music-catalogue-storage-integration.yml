name: Music catalogue identity and storage integration

on:
  pull_request:
    paths:
      - 'music-dna/**'
      - 'dna/**'
      - 'music-e2e/**'
      - 'music_catalogue/**'
      - 'holochain_storage/**'
      - 'crates/storage-node/**'
      - 'tests/**'
      - '.github/workflows/music-catalogue-storage-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-rust-node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test the real encrypted HTTP node
        run: |
          cargo test --manifest-path crates/storage-node/Cargo.toml
          cargo build --manifest-path crates/storage-node/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python storage/catalogue contracts
        run: python -m pip install -e .
      - name: Verify S1 S2 S4 S5 across live Rust node
        env:
          HOLOCHAIN_STORAGE_NODE_BIN: ${{ github.workspace }}/crates/storage-node/target/debug/holochain-storage-node
        run: python -m unittest discover -s tests -v

  real-conductors:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build both Holochain 0.7 DNAs and run two-DNA Sweettest
        run: |
          nix develop ./music-e2e --command bash -euc '
            cd music-dna
            cargo build --release --target wasm32-unknown-unknown
            hc dna pack workdir
            cd ../dna
            cargo build --release --target wasm32-unknown-unknown
            hc dna pack workdir
            cd ../music-e2e
            cargo test --test catalogue_storage_identity_sweettest -- --nocapture
          '
