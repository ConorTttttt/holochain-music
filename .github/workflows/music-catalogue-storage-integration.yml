name: Music catalogue identity and storage integration

on:
  pull_request:
    paths:
      - 'music-dna/**'
      - 'dna/**'
      - 'music-e2e/**'
      - 'music_catalogue/**'
      - 'holochain_storage/**'
      - 'crates/storage-node/**'
      - 'crates/moq-music/**'
      - 'tests/**'
      - '.github/workflows/music-catalogue-storage-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-rust-node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test the real encrypted HTTP node
        run: |
          cargo test --manifest-path crates/storage-node/Cargo.toml
          cargo build --manifest-path crates/storage-node/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python storage/catalogue contracts
        run: python -m pip install -e .
      - name: Verify S1 S2 S4 S5 across live Rust node
        env:
          HOLOCHAIN_STORAGE_NODE_BIN: ${{ github.workspace }}/crates/storage-node/target/debug/holochain-storage-node
        run: python -m unittest discover -s tests -v

  real-conductors:
    # One isolated runner per group: each job owns its own conductors, ports,
    # temporary directories and CPU, and runs its suites one after another.
    # Every Sweettest binary of the former single job is listed exactly once;
    # assertions and the 90-minute budget are unchanged. fail-fast is off so
    # one group's failure never hides another group's result.
    name: real-conductors (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: identity-s7
            tests: catalogue_storage_identity_sweettest s7_live_verified_retrieval_sweettest
          - name: s9-s11
            tests: s9_holochain_moq_sweettest s10_granted_moq_playback_sweettest s11_buffered_granted_moq_sweettest
          - name: s12-s14
            tests: s12_overlapping_moq_playback_sweettest s13_adaptive_moq_playback_sweettest s14_verified_seek_repair_sweettest
          - name: s15-s16
            tests: s15_selective_moq_repair_sweettest s16_inflight_moq_seek_sweettest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python S7 fixture/client dependencies
        run: python -m pip install -e .
      - uses: dtolnay/rust-toolchain@stable
      - name: Build real S4 Rust storage node for S7
        run: cargo build --manifest-path crates/storage-node/Cargo.toml
      - name: Test MoQ TLS pin and S17 explicit RFC1918 LAN endpoint rules
        run: cargo test --manifest-path crates/moq-music/Cargo.toml
      - name: Build real MoQ/QUIC publisher/subscriber for S9
        run: cargo build --manifest-path crates/moq-music/Cargo.toml
      - uses: cachix/install-nix-action@v31
        with:
          # Holonix declares its binary cache in its flake nixConfig, which CI
          # does not apply, so holochain/hc/lair were compiled from source
          # (~45 of the 90 minutes). Same substituter and signing key as
          # holonix flake.nix nixConfig; on a cache miss Nix still builds.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://holochain-ci.cachix.org
            extra-trusted-public-keys = holochain-ci.cachix.org-1:5IUSkZc0aoRS53rfkvH9Kid40NpyjwCMCzwRTXy+QN8=
      - name: Build Holochain DNAs and run ${{ matrix.group.name }} on real conductors
        env:
          SUITES: ${{ matrix.group.tests }}
          RUST_BACKTRACE: '1'
        run: |
          export HOLOCHAIN_MUSIC_PYTHON="$(command -v python)"
          export HOLOCHAIN_STORAGE_NODE_BIN="$PWD/crates/storage-node/target/debug/holochain-storage-node"
          export HOLOCHAIN_MOQ_BIN="$PWD/crates/moq-music/target/debug/holochain-music-moq"
          export CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0
          mkdir -p "$RUNNER_TEMP/sweettest-logs"
          nix develop ./music-e2e --command bash -euc '
            cd music-dna
            cargo build --release --target wasm32-unknown-unknown
            hc dna pack workdir
            cd ../dna
            cargo build --release --target wasm32-unknown-unknown
            hc dna pack workdir
            cd ..
            cp music-dna/workdir/music_catalogue.dna integration/workdir/
            cp dna/workdir/music_storage.dna integration/workdir/
            hc app pack integration/workdir
            cd music-e2e
            for suite in $SUITES; do
              echo "::group::$suite"
              # Full output (including any teardown abort) is kept for diagnosis.
              cargo test --test "$suite" -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sweettest-logs/$suite.log"
              status=${PIPESTATUS[0]}
              echo "::endgroup::"
              if [ "$status" -ne 0 ]; then
                echo "::error::$suite failed with status $status"
                exit "$status"
              fi
            done
          '
      - name: Keep Sweettest logs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweettest-logs-${{ matrix.group.name }}
          path: ${{ runner.temp }}/sweettest-logs/*.log
          if-no-files-found: ignore
