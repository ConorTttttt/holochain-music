name: Holochain DNA typecheck

on:
  push:
    paths:
      - 'dna/**'
      - '.github/workflows/dna-typecheck.yml'
  pull_request:
    paths:
      - 'dna/**'
      - '.github/workflows/dna-typecheck.yml'

permissions:
  contents: read

jobs:
  rust-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Typecheck Holochain zomes for wasm
        run: cargo check --manifest-path dna/Cargo.toml --target wasm32-unknown-unknown
      - name: Rust integrity helper tests
        run: cargo test --manifest-path dna/Cargo.toml -p music_storage_integrity --lib
