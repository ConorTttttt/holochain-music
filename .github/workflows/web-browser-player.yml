name: Web browser player (experimental)

# Isolated browser development track. It never builds or publishes a release
# and does not gate the desktop RC workflows. Every job reports its own result:
#   web-units          JS syntax, unit tests, crypto vectors vs native Python (Node)
#   chromium-crypto    the same vectors inside real Chromium WebCrypto
#   adapter            media adapter policy tests (Python)
#   call-remote-vectors  Holochain 0.7 native ZomeCallParams/ZomeCallResponse vectors are reproducible
#   gateway-candidate  accepted gateway source reproduced + call_remote patch: fmt, cargo test, clippy, build
#   interop            native Music artist + peer, CANDIDATE gateway, real Chromium/HWC (HWC core suite
#                      runs inside web/hwc/build-extension.sh), Checkpoints E and F
#
# Browser jobs run on ubuntu-24.04: Playwright 1.57.0 (pinned in web/hwc/pins.json)
# cannot install Chromium dependencies on ubuntu-latest (26.04).
# Pull requests (and manual dispatch) only, one run per ref: a push to a PR
# branch would otherwise run every job twice.
on:
  pull_request:
    paths: ['web/**', 'docs/web/**', '.github/workflows/web-browser-player.yml', 'music-dna/**', 'dna/**', 'integration/**',
            'holochain_music/**', 'music_catalogue/**', 'holochain_storage/**', 'crates/moq-music/**']
  workflow_dispatch:

concurrency:
  group: web-browser-player-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.0'
  PYTHON_VERSION: '3.12'

jobs:
  web-units:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - run: python -m pip install -e .
      - name: JavaScript syntax
        run: find web/src web/scripts web/integration web/tests -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - name: Generate compatibility vectors with the native Python implementation
        run: python web/tests/vectors/generate_vectors.py web/tests/vectors/.generated/v1.json
      - name: Unit tests and Node WebCrypto vectors
        run: node --test web/tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        with: { name: web-crypto-vectors, path: web/tests/vectors/.generated/v1.json, retention-days: 7 }

  chromium-crypto:
    needs: web-units
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/download-artifact@v4
        with: { name: web-crypto-vectors, path: vectors }
      - name: Pinned Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null
          npm install --no-audit --no-fund "playwright@$(jq -r .playwright "$GITHUB_WORKSPACE/web/hwc/pins.json")"
          npx playwright install --with-deps chromium
      - name: Vectors inside Chromium WebCrypto
        env: { HM_PLAYWRIGHT: '${{ runner.temp }}/pw/node_modules/playwright' }
        run: node web/tests/chromium-crypto.mjs vectors/v1.json

  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - run: python -m pip install -e .
      - run: python -m unittest discover -s web/adapter -p 'test_*.py' -v

  call-remote-vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate native Holochain 0.7 vectors and compare with the committed file
        run: |
          cd web/hwc/remote-call/vectors-rs
          cargo run --locked -q > "$RUNNER_TEMP/vectors.json"
          diff <(jq -S . "$RUNNER_TEMP/vectors.json") <(jq -S . ../zome-call-vectors.json)

  gateway-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain pinned by h2hc-linker (rust-toolchain.toml 1.96.1)
        uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '1.96.1', components: 'rustfmt, clippy' }
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev pkg-config build-essential
      - name: Sources (upstream h2hc-linker, Imposter recipe)
        run: |
          git clone --quiet https://github.com/Holo-Host/h2hc-linker.git "$RUNNER_TEMP/h2hc"
          git clone --quiet --no-checkout "$(jq -r .imposter_repository web/hwc/pins.json)" "$RUNNER_TEMP/imposter"
          git -C "$RUNNER_TEMP/imposter" fetch --quiet origin "$(jq -r .gateway.recipe_commit web/hwc/pins.json)"
      - name: Reproduce accepted source, apply call_remote, fmt/test/clippy, build
        run: bash web/gateway/build-candidate.sh "$RUNNER_TEMP/h2hc" "$RUNNER_TEMP/imposter" "$RUNNER_TEMP/gateway-candidate"
      - uses: actions/upload-artifact@v4
        with: { name: gateway-call-remote-candidate, path: '${{ runner.temp }}/gateway-candidate/', retention-days: 14 }

  interop:
    needs: [web-units, adapter, gateway-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '${{ env.PYTHON_VERSION }}' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: python -m pip install -e .
      - name: Pinned Holochain 0.7.0 binaries
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          for t in hc holochain lair-keystore kitsune2-bootstrap-srv; do
            a="$t-x86_64-unknown-linux-gnu"
            gh release download holochain-0.7.0 -R holochain/holochain -p "$a" -D "$RUNNER_TEMP"
            echo "$(jq -r --arg a "$a" '.holochain.sha256[$a]' web/hwc/pins.json)  $RUNNER_TEMP/$a" | sha256sum -c -
            install -m 0755 "$RUNNER_TEMP/$a" "$RUNNER_TEMP/bin/$t"
          done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: DNA and desktop sources are unchanged from main (hard failure)
        run: |
          git fetch --quiet --no-tags origin main
          git diff --exit-code --stat FETCH_HEAD...HEAD -- music-dna dna integration holochain_music \
            music_catalogue holochain_storage crates music-e2e pyproject.toml
      - name: Build the unchanged Music DNAs and hApp
        run: |
          (cd music-dna && cargo build --locked --release --target wasm32-unknown-unknown && hc dna pack workdir)
          (cd dna && cargo build --locked --release --target wasm32-unknown-unknown && hc dna pack workdir)
          cp music-dna/workdir/music_catalogue.dna dna/workdir/music_storage.dna integration/workdir/
          hc app pack integration/workdir
          # Zome Wasm embeds toolchain- and machine-specific paths, so the hash
          # is not pinned across machines. Identity is enforced where it matters:
          # run_interop.py fails unless the native conductor installed exactly
          # these DNAs, and check A2 fails unless HWC computed the same hashes.
          { echo '### DNA identities built in this run'; for role in music_catalogue music_storage; do
              echo "- \`$role\` \`$(hc dna hash integration/workdir/$role.dna)\`"; done
            echo "- hApp SHA-256 \`$(sha256sum integration/workdir/holochain_music.happ | cut -d' ' -f1)\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build native MoQ host and app bridge
        run: |
          cargo build --locked --release --manifest-path crates/moq-music/Cargo.toml
          cargo build --locked --release --manifest-path music-e2e/Cargo.toml --bin music_app_bridge
      - uses: actions/download-artifact@v4
        with: { name: gateway-call-remote-candidate, path: '${{ runner.temp }}/gateway-candidate' }
      - name: Pinned Imposter baseline, accepted gateway (recorded) and HWC extension
        run: |
          pins=web/hwc/pins.json
          git clone --quiet --no-checkout "$(jq -r .imposter_repository $pins)" "$RUNNER_TEMP/imposter"
          git -C "$RUNNER_TEMP/imposter" checkout --quiet "$(jq -r .imposter_baseline_commit $pins)"
          git -C "$RUNNER_TEMP/imposter" fetch --quiet --depth=1 origin "$(jq -r .gateway.archive_ref $pins)"
          test "$(git -C "$RUNNER_TEMP/imposter" rev-parse FETCH_HEAD)" = "$(jq -r .gateway.archive_commit $pins)"
          git -C "$RUNNER_TEMP/imposter" show FETCH_HEAD:h2hc-linker-linux-x86_64.gz | gunzip > "$RUNNER_TEMP/bin/h2hc-linker"
          echo "$(jq -r .gateway.sha256 $pins)  $RUNNER_TEMP/bin/h2hc-linker" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/h2hc-linker"
          git clone --quiet "$(jq -r .hwc_repository $pins)" "$RUNNER_TEMP/hwc"
          git -C "$RUNNER_TEMP/hwc" checkout --quiet "$(jq -r .hwc_commit $pins)"
          (cd "$RUNNER_TEMP/gateway-candidate" && sha256sum -c SHA256SUMS && chmod 0755 h2hc-linker-call-remote-candidate)
          bash web/hwc/build-extension.sh "$RUNNER_TEMP/hwc" "$RUNNER_TEMP/imposter"
      - name: Pinned Playwright Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y >/dev/null
          npm install --no-audit --no-fund "playwright@$(jq -r .playwright "$GITHUB_WORKSPACE/web/hwc/pins.json")"
          npx playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Native artist -> Chromium/HWC listener interop
        env:
          HOLOCHAIN_MOQ_BIN: ${{ github.workspace }}/crates/moq-music/target/release/holochain-music-moq
          HOLOCHAIN_MUSIC_BRIDGE_BIN: ${{ github.workspace }}/music-e2e/target/release/music_app_bridge
          HOLOCHAIN_MUSIC_HAPP: ${{ github.workspace }}/integration/workdir/holochain_music.happ
          H2HC_GATEWAY_BIN: ${{ runner.temp }}/gateway-candidate/h2hc-linker-call-remote-candidate
          HWC_EXTENSION_DIR: ${{ runner.temp }}/hwc/packages/extension/dist-chrome
          HM_PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright
        run: python web/integration/run_interop.py --work "$RUNNER_TEMP/interop"
      - name: Check report (PASS / FAIL / BLOCKED per check)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/interop/evidence.json" ]; then
            { echo '### Checkpoints'; jq -r '.checkpoints // {} | to_entries[] | "- **\(.key)**: \(.value.result)"' "$RUNNER_TEMP/interop/evidence.json"
              echo '### Interop checks'; echo '| Result | Check | Detail |'; echo '| --- | --- | --- |'
              jq -r '.checks[] | "| \(.result) | \(.id) | \((.error // "") | gsub("[\n|]"; " ") | .[0:160]) |"' "$RUNNER_TEMP/interop/evidence.json"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "NOT RUN: the interop harness produced no evidence (see earlier steps)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep sanitized evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-interop-evidence
          path: |
            ${{ runner.temp }}/interop/evidence.json
            ${{ runner.temp }}/interop/logs/*.log
          retention-days: 14
