name: Storage protocol tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install prototype
        run: python -m pip install -e .
      - name: Run unit and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Exercise file-agnostic end-to-end demo
        run: |
          printf '%s' 'arbitrary file bytes, not media' > example.bin
          python -m holochain_storage.demo example.bin
